services:
  db:
    image: pgvector/pgvector:pg16
    container_name: cyberguard-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: cyberguard
      POSTGRES_USER: cyberguard
      POSTGRES_PASSWORD: LocalOnly_CG_2026_change_me
    ports:
      - "5432:5432"
    volumes:
      - cyberguard_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cyberguard -d cyberguard"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  cyberguard_db_data: